<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Segoe UI', -apple-system, sans-serif;">
  <!-- Definitions for Markers/Gradients -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Flow Graph - TransaksiController@store (POS)</text>

  <!-- Node 1: Start & Validation -->
  <rect x="220" y="60" width="160" height="50" rx="10" fill="url(#blueGrad)" />
  <text x="300" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Node 1: Start &amp; Validate</text>
  <text x="300" y="98" text-anchor="middle" font-size="9" fill="#f1f5f9">Request Inputs</text>

  <!-- Connector 1 -> 2 -->
  <line x1="300" y1="110" x2="300" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 2: Loop 1 - Stock Check -->
  <rect x="220" y="140" width="160" height="50" rx="10" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2" />
  <text x="300" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Node 2: Loop 1</text>
  <text x="300" y="178" text-anchor="middle" font-size="9" fill="#475569">Stock Validation Loop</text>

  <!-- Connector 2 -> 3 -->
  <line x1="300" y1="190" x2="300" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 3: If Qty > Stock -->
  <polygon points="300,220 370,255 300,290 230,255" fill="url(#amberGrad)" />
  <text x="300" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Node 3: If</text>
  <text x="300" y="264" text-anchor="middle" font-size="9" fill="#ffffff">Qty &gt; Stock?</text>

  <!-- Connector 3 -> 4 (True) -->
  <line x1="370" y1="255" x2="460" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="415" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#e11d48">Yes</text>

  <!-- Node 4: Return Stock Error -->
  <rect x="460" y="230" width="180" height="50" rx="10" fill="url(#roseGrad)" />
  <text x="550" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Node 4: Error Redirect</text>
  <text x="550" y="268" text-anchor="middle" font-size="9" fill="#f1f5f9">Back with Stock Error</text>

  <!-- Connector 3 -> 2 (False / Loop next) -->
  <path d="M 230 255 L 170 255 L 170 165 L 220 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="185" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">No</text>

  <!-- Connector 2 -> 5 (Finished loop) -->
  <path d="M 380 165 L 420 165 L 420 330 L 380 330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="445" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">All Pass</text>

  <!-- Node 5: Begin DB Tx & Sum Total -->
  <rect x="220" y="305" width="160" height="50" rx="10" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2" />
  <text x="300" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Node 5: Try Block</text>
  <text x="300" y="343" text-anchor="middle" font-size="9" fill="#475569">DB Tx &amp; Calculate Total</text>

  <!-- Connector 5 -> 6 -->
  <line x1="300" y1="355" x2="300" y2="385" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 6: Create Transaksi Header -->
  <rect x="220" y="385" width="160" height="50" rx="10" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2" />
  <text x="300" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Node 6: Save Header</text>
  <text x="300" y="423" text-anchor="middle" font-size="9" fill="#475569">Transaksi::create()</text>

  <!-- Connector 6 -> 7 -->
  <line x1="300" y1="435" x2="300" y2="465" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 7: Loop Save Details & Decrement -->
  <rect x="220" y="465" width="160" height="50" rx="10" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2" />
  <text x="300" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Node 7: Save Details</text>
  <text x="300" y="503" text-anchor="middle" font-size="9" fill="#475569">Loop &amp; Decrement Stock</text>

  <!-- Connector 7 -> 8 -->
  <line x1="300" y1="515" x2="300" y2="545" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 8: DB Commit & Redirect -->
  <rect x="220" y="545" width="160" height="50" rx="10" fill="url(#emeraldGrad)" />
  <text x="300" y="570" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Node 8: Success Exit</text>
  <text x="300" y="583" text-anchor="middle" font-size="9" fill="#f1f5f9">DB Commit &amp; Redirect</text>

  <!-- Node 9: DB Rollback & Catch Return -->
  <rect x="480" y="385" width="180" height="50" rx="10" fill="url(#roseGrad)" />
  <text x="570" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Node 9: Catch Rollback</text>
  <text x="570" y="423" text-anchor="middle" font-size="9" fill="#f1f5f9">DB Rollback &amp; Redirect</text>

  <!-- Connectors to Catch Block (Exceptions) -->
  <!-- From Node 5 -->
  <path d="M 380 330 L 450 330 L 450 395 L 480 395" fill="none" stroke="#e11d48" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- From Node 6 -->
  <path d="M 380 410 L 480 410" fill="none" stroke="#e11d48" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- From Node 7 -->
  <path d="M 380 490 L 450 490 L 450 420 L 480 420" fill="none" stroke="#e11d48" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Legend -->
  <rect x="50" y="500" width="130" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="60" y="518" font-size="10" font-weight="bold" fill="#334155">Legend:</text>
  
  <rect x="60" y="528" width="10" height="10" fill="#2563eb" />
  <text x="75" y="537" font-size="9" fill="#475569">Start / Main Action</text>

  <rect x="60" y="543" width="10" height="10" fill="#f59e0b" />
  <text x="75" y="552" font-size="9" fill="#475569">Decision / Condition</text>

  <rect x="60" y="558" width="10" height="10" fill="#059669" />
  <text x="75" y="567" font-size="9" fill="#475569">Success Exit Path</text>

  <rect x="60" y="573" width="10" height="10" fill="#e11d48" />
  <text x="75" y="582" font-size="9" fill="#475569">Failure / Exception</text>

  <line x1="60" y1="595" x2="80" y2="595" stroke="#e11d48" stroke-dasharray="4" stroke-width="1.5" />
  <text x="85" y="598" font-size="9" fill="#475569">Exception path</text>
</svg>
